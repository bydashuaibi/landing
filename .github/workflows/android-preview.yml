name: Android preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install web dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Sync offline app
        working-directory: mobile
        run: npm run android:sync
      - name: Build debug APK
        working-directory: mobile/android
        env:
          STUDYTRAIL_PREVIEW_KEYSTORE: ${{ secrets.STUDYTRAIL_PREVIEW_KEYSTORE }}
          STUDYTRAIL_STORE_PASSWORD: ${{ secrets.STUDYTRAIL_STORE_PASSWORD }}
        shell: bash
        run: |
          test -n "$STUDYTRAIL_PREVIEW_KEYSTORE"
          export STUDYTRAIL_KEYSTORE="$RUNNER_TEMP/studytrail-preview.p12"
          printf '%s' "$STUDYTRAIL_PREVIEW_KEYSTORE" | base64 --decode > "$STUDYTRAIL_KEYSTORE"
          bash gradlew testDebugUnitTest assembleDebug --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StudyTrail-Android-preview
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
