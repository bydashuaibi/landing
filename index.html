<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>着陆 · 把焦虑变成下一步</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#eef0f6; --line:#e3e6ef;
  --text:#1f2330; --muted:#7b8194; --violet:#7c5cff; --violet-2:#9d86ff;
  --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6;
  --shadow:0 8px 30px rgba(40,40,80,.08); --radius:16px;
  --sun:#fbbf24; --cloud:#94a3b8; --rain:#60a5fa; --storm:#6366f1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* 图标 */
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;flex:none}
.icon.sm{width:15px;height:15px}
.icon.lg{width:26px;height:26px}

/* 布局 */
#app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--violet),var(--violet-2));display:flex;align-items:center;justify-content:center}
.brand .name{font-weight:800;font-size:18px;letter-spacing:.5px}
.brand .sub{font-size:11px;color:var(--muted)}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
  color:var(--muted);font-weight:600;font-size:14px;transition:.15s;text-align:left;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(124,92,255,.14),rgba(157,134,255,.10));color:var(--violet)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 22px;
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:17px;font-weight:800}
.topbar .actions{display:flex;gap:8px}
#view{padding:22px;max-width:920px;width:100%;margin:0 auto}

/* 移动端 */
.tabbar{
  display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index:30;overflow-x:auto;
}
.tabbar .nav-item{flex:none;flex-direction:column;gap:3px;font-size:11px;padding:6px 12px;border-radius:10px}
.tabbar .nav-item .icon{width:22px;height:22px}
.fab{
  display:none;position:fixed;right:18px;bottom:74px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;font-size:24px;
  box-shadow:0 10px 24px rgba(124,92,255,.4);z-index:31;align-items:center;justify-content:center;
}

/* 卡片 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px}
.card .hint{color:var(--muted);font-size:13px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}

/* 按钮 */
.btn{padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.ghost:hover{background:#e3e6f2}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%;justify-content:center}

/* 表单 */
.field{margin-bottom:14px}
.field>label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);
}
.field textarea{resize:vertical;min-height:84px}
.field .muted{font-size:12px;margin-top:4px;display:block}

/* 倾倒台 */
.dump{border-left:4px solid var(--violet)}
.dump .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.tag.do{background:rgba(34,197,94,.14);color:#16a34a}
.tag.drop{background:rgba(148,163,184,.18);color:#64748b}
.tag.feel{background:rgba(245,158,11,.16);color:#d97706}
.dump .acts{display:flex;gap:6px;margin-top:12px}
.dump .text{white-space:pre-wrap;word-break:break-word;margin-top:6px}

/* 今天一件 */
.one-thing{border:2px dashed var(--violet);text-align:center;padding:30px 18px}
.one-thing .big{font-size:20px;font-weight:800;margin:10px 0}
.one-thing .done-state{color:var(--green);font-weight:800}
.kind{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.kind button{flex:1;min-width:90px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.kind button.on{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border-color:transparent}

/* 方向罗盘 */
.compass-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compass-row textarea{min-height:70px}
.deviate{font-weight:800;padding:10px 14px;border-radius:12px;margin-top:10px}

/* 情绪气象 */
.weather-pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.wbtn{flex:1;min-width:78px;padding:16px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;font-weight:700}
.wbtn .emo{font-size:26px;display:block;margin-bottom:4px}
.wbtn.on{border-color:transparent;color:#fff}
.wbtn.sun.on{background:var(--sun)} .wbtn.cloud.on{background:var(--cloud)}
.wbtn.rain.on{background:var(--rain)} .wbtn.storm.on{background:var(--storm)}
.trend{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:12px;padding:0 4px}
.trend .bar{flex:1;background:linear-gradient(180deg,var(--violet-2),var(--violet));border-radius:6px 6px 0 0;min-height:4px;position:relative}
.trend .bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.trend .bar i{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-style:normal;font-weight:700}

/* AI 陪伴 */
.chat{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow-y:auto;padding:4px}
.bubble{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble.ai{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.companion-input{display:flex;gap:8px;margin-top:12px}
.companion-input textarea{flex:1;min-height:46px}
.typing{font-size:12px;color:var(--muted);padding:4px 2px}

/* 树洞 */
.post{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface)}
.post .head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.post .body{white-space:pre-wrap;word-break:break-word}

/* 模态 */
.sheet-mask{position:fixed;inset:0;background:rgba(20,22,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.sheet-mask.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px;max-height:92vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:4px}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1;justify-content:center}

/* toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2330;color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;z-index:80;box-shadow:var(--shadow);animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* 设置里的版本 */
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.ver a{color:var(--violet);text-decoration:none}

@media(max-width:820px){
  .sidebar{display:none}
  .tabbar{display:flex}
  .fab{display:flex}
  #view{padding:16px 14px 90px}
  .compass-row{grid-template-columns:1fr}
  .topbar{padding:14px 16px}
}
</style>
</head>
<body>

</svg>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><svg class="icon" style="color:#fff" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 0 0-9 9 9 9 0 0 0 9 9 9 9 0 0 0 9-9 9 9 0 0 0-9-9zm0 4 5 5-5 5-5-5z"/></svg></div>
      <div><div class="name">着陆</div><div class="sub">把焦虑变成下一步</div></div>
    </div>
    <button class="nav-item active" data-tab="dump"><svg class="icon"><use href="#i-cloud"/></svg>倾倒台</button>
    <button class="nav-item" data-tab="today"><svg class="icon"><use href="#i-target"/></svg>今天一件</button>
    <button class="nav-item" data-tab="compass"><svg class="icon"><use href="#i-compass"/></svg>方向罗盘</button>
    <button class="nav-item" data-tab="weather"><svg class="icon"><use href="#i-leaf"/></svg>情绪气象</button>
    <button class="nav-item" data-tab="companion"><svg class="icon"><use href="#i-chat"/></svg>AI 陪伴</button>
    <button class="nav-item" data-tab="community"><svg class="icon"><use href="#i-people"/></svg>树洞</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="viewTitle">倾倒台</h1>
      <div class="actions">
        <button class="btn ghost sm" id="topNew"><svg class="icon sm"><use href="#i-plus"/></svg>新想法</button>
        <button class="btn ghost sm" id="topSettings"><svg class="icon sm"><use href="#i-cog"/></svg>设置</button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <nav class="tabbar">
    <button class="nav-item active" data-tab="dump"><svg class="icon"><use href="#i-cloud"/></svg>倾倒台</button>
    <button class="nav-item" data-tab="today"><svg class="icon"><use href="#i-target"/></svg>今天一件</button>
    <button class="nav-item" data-tab="compass"><svg class="icon"><use href="#i-compass"/></svg>罗盘</button>
    <button class="nav-item" data-tab="weather"><svg class="icon"><use href="#i-leaf"/></svg>气象</button>
    <button class="nav-item" data-tab="companion"><svg class="icon"><use href="#i-chat"/></svg>陪伴</button>
    <button class="nav-item" data-tab="community"><svg class="icon"><use href="#i-people"/></svg>树洞</button>
  </nav>
</div>

<button class="fab" id="fabNew"><svg class="icon" style="color:#fff"><use href="#i-plus"/></svg></button>
<div class="sheet-mask hidden" id="sheet"></div>
<div class="toast hidden" id="toast"></div>

<script src="app.js?v=1"></script>
</body>
</html>
