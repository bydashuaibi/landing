<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>着陆 · 把焦虑变成下一步</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#eef0f6; --line:#e3e6ef;
  --text:#1f2330; --muted:#7b8194; --violet:#7c5cff; --violet-2:#9d86ff;
  --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6;
  --teal:#14b8a6; --rose:#f43f5e;
  --shadow:0 8px 30px rgba(40,40,80,.08); --radius:16px;
  --sun:#fbbf24; --cloud:#94a3b8; --rain:#60a5fa; --storm:#6366f1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;flex:none}
.icon.sm{width:15px;height:15px}
.icon.lg{width:26px;height:26px}

/* 布局 */
#app{display:flex;min-height:100vh}
.sidebar{
  width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--violet),var(--violet-2));display:flex;align-items:center;justify-content:center}
.brand .name{font-weight:800;font-size:18px;letter-spacing:.5px}
.brand .sub{font-size:11px;color:var(--muted)}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:12px;
  color:var(--muted);font-weight:600;font-size:14px;transition:.15s;text-align:left;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(124,92,255,.14),rgba(157,134,255,.10));color:var(--violet)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 22px;
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:17px;font-weight:800}
.topbar .actions{display:flex;gap:8px}
#view{padding:22px;max-width:960px;width:100%;margin:0 auto}

/* 移动端 tabbar */
.tabbar{
  display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  z-index:30;overflow-x:auto;
}
.tabbar .nav-item{flex:none;flex-direction:column;gap:3px;font-size:11px;padding:6px 10px;border-radius:10px}
.tabbar .nav-item .icon{width:22px;height:22px}
.fab{
  display:none;position:fixed;right:18px;bottom:74px;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;font-size:22px;
  box-shadow:0 10px 24px rgba(124,92,255,.4);z-index:31;align-items:center;justify-content:center;
}

/* 卡片 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px}
.card .hint{color:var(--muted);font-size:13px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}

/* 按钮 */
.btn{padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.ghost:hover{background:#e3e6f2}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%;justify-content:center}
.btn.teal{background:linear-gradient(135deg,#14b8a6,#06b6d4);color:#fff}

/* 表单 */
.field{margin-bottom:14px}
.field>label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);
}
.field textarea{resize:vertical;min-height:80px}
.field .muted{font-size:12px;margin-top:4px;display:block}

/* 推送区（首页日报提示） */
.push{
  background:linear-gradient(135deg,rgba(124,92,255,.12),rgba(20,184,166,.08));
  border:1px solid rgba(124,92,255,.25);border-radius:14px;padding:14px 16px;margin-bottom:16px;
  display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:.15s;
}
.push:hover{background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(20,184,166,.12))}
.push .pulse{width:9px;height:9px;border-radius:50%;background:var(--violet);flex:none;margin-top:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}70%{box-shadow:0 0 0 10px rgba(124,92,255,0)}}
.push .ptitle{font-weight:800;font-size:14px}
.push .pbody{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}

/* 任务卡 */
.task{
  display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);
  border-radius:14px;margin-bottom:10px;background:var(--surface);transition:.12s;
}
.task:hover{border-color:var(--violet-2)}
.task .tinfo{flex:1;min-width:0}
.task .tname{font-weight:800;font-size:15px}
.task .tmeta{color:var(--muted);font-size:12px;margin-top:2px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--violet-2));transition:width .35s}
.paused{opacity:.58}
.badge-done{font-size:11px;font-weight:800;color:var(--green);background:rgba(34,197,94,.14);padding:3px 9px;border-radius:999px}
.badge-pause{font-size:11px;font-weight:800;color:var(--amber);background:rgba(245,158,11,.16);padding:3px 9px;border-radius:999px}

/* 分类标签 */
.cat{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(124,92,255,.12);color:var(--violet)}
.cat.health{background:rgba(34,197,94,.14);color:#16a34a}
.cat.edu{background:rgba(59,130,246,.14);color:#2563eb}
.cat.create{background:rgba(168,85,247,.14);color:#9333ea}
.cat.life{background:rgba(245,158,11,.16);color:#d97706}
.cat.nature{background:rgba(20,184,166,.14);color:#0d9488}
.cat.recharge{background:rgba(251,191,36,.16);color:#b45309}

/* 今天一件 */
.one-thing{border:2px dashed var(--violet);text-align:center;padding:26px 18px}
.one-thing .big{font-size:19px;font-weight:800;margin:8px 0}
.one-thing .done-state{color:var(--green);font-weight:800}

/* 快捷打卡区 */
.quick-checkin{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qci{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;transition:.12s}
.qci:hover{border-color:var(--violet);background:rgba(124,92,255,.06)}
.qci.done{border-color:var(--green);background:rgba(34,197,94,.08);color:#16a34a}

/* 倾倒台 */
.dump{border-left:4px solid var(--violet)}
.dump .text{white-space:pre-wrap;word-break:break-word;margin-top:6px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.tag.do{background:rgba(34,197,94,.14);color:#16a34a}
.tag.drop{background:rgba(148,163,184,.18);color:#64748b}
.tag.feel{background:rgba(245,158,11,.16);color:#d97706}

/* 情绪气象 */
.weather-pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.wbtn{flex:1;min-width:78px;padding:16px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;font-weight:700}
.wbtn .emo{font-size:26px;display:block;margin-bottom:4px}
.wbtn.on{border-color:transparent;color:#fff}
.wbtn.sun.on{background:var(--sun)} .wbtn.cloud.on{background:var(--cloud)}
.wbtn.rain.on{background:var(--rain)} .wbtn.storm.on{background:var(--storm)}

/* AI 陪伴 */
.chat{display:flex;flex-direction:column;gap:12px;max-height:54vh;overflow-y:auto;padding:4px}
.bubble{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble.ai{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.companion-input{display:flex;gap:8px;margin-top:12px}
.companion-input textarea{flex:1;min-height:46px}

/* 日报 */
.digest-cat{margin-bottom:16px}
.digest-cat .ch{font-weight:800;font-size:14px;margin-bottom:8px;color:var(--violet);display:flex;align-items:center;gap:6px}
.repo{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;background:var(--surface)}
.repo .rn{font-weight:700;font-size:14px}
.repo .rd{color:var(--muted);font-size:12px;margin-top:3px}
.repo .rm{color:var(--amber);font-size:12px;margin-top:3px;font-weight:700}
.repo a{color:var(--blue);text-decoration:none}

/* 看板/周报 */
.kanban{display:flex;flex-direction:column;gap:6px}
.kb-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.kb-row .kl{width:96px;font-size:13px;font-weight:700;flex:none}
.kb-row .kt{flex:1;height:24px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.kb-row .kt>div{height:100%;border-radius:6px;transition:width .4s}
.kb-row .kv{width:64px;text-align:right;font-size:12px;color:var(--muted);flex:none}
.stat-row{display:flex;gap:12px;text-align:center}
.stat-col{flex:1;padding:14px 8px;border-radius:14px;background:var(--surface-2)}
.stat-num{font-size:28px;font-weight:900}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.day-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--surface)}
.day-card .dc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.day-card .dc-mood{font-size:20px}
.day-card .dc-stats{display:flex;gap:16px;font-size:13px;margin-bottom:8px}
.day-card .dc-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.day-card .dc-bar>div{height:100%;border-radius:999px}
.day-card .dc-comment{font-size:13px;color:var(--green);font-weight:600;margin-top:6px}

/* 树洞 */
.post{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface)}
.post .head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.post .body{white-space:pre-wrap;word-break:break-word}

/* 模态 */
.sheet-mask{position:fixed;inset:0;background:rgba(20,22,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.sheet-mask.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:580px;border-radius:20px 20px 0 0;padding:22px;max-height:92vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:4px}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1;justify-content:center}

/* 分类选择器（量力风格） */
.cat-grid{display:flex;gap:8px;flex-wrap:wrap}
.cat-chip{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;transition:.12s}
.cat-chip.on{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border-color:transparent}
.sub-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sub-chip{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer}
.sub-chip.on{background:var(--violet);color:#fff;border-color:transparent}

/* toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2330;color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;z-index:80;box-shadow:var(--shadow);animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.ver a{color:var(--violet);text-decoration:none}

@media(max-width:820px){
  .sidebar{display:none}
  .tabbar{display:flex}
  .fab{display:flex}
  #view{padding:16px 14px 90px}
  .topbar{padding:14px 16px}
  .kb-row .kl{width:72px}
  .stat-row{gap:8px}
  .stat-num{font-size:22px}
}
</style>
</head>

<symbol id="i-x" viewBox="0 0 24 24"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3 10.6 10.6 17 4.3z" transform="translate(1 0)"/></symbol>
</svg>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><svg class="icon" style="color:#fff" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 0 0-9 9 9 9 0 0 0 9 9 9 9 0 0 0 9-9 9 9 0 0 0-9-9zm0 4 5 5-5 5-5-5z"/></svg></div>
      <div><div class="name">着陆</div><div class="sub">把焦虑变成下一步</div></div>
    </div>
    <button class="nav-item active" data-tab="today"><svg class="icon"><use href="#i-home"/></svg>今日</button>
    <button class="nav-item" data-tab="tasks"><svg class="icon"><use href="#i-list"/></svg>任务</button>
    <button class="nav-item" data-tab="weekly"><svg class="icon"><use href="#i-chart"/></svg>周报</button>
    <button class="nav-item" data-tab="digest"><svg class="icon"><use href="#i-trending"/></svg>日报</button>
    <button class="nav-item" data-tab="companion"><svg class="icon"><use href="#i-chat"/></svg>陪伴</button>
    <button class="nav-item" data-tab="me"><svg class="icon"><use href="#i-user"/></svg>我的</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="viewTitle">今日</h1>
      <div class="actions">
        <button class="btn ghost sm" id="topNew"><svg class="icon sm"><use href="#i-plus"/></svg>新建</button>
        <button class="btn ghost sm" id="topSettings"><svg class="icon sm"><use href="#i-cog"/></svg>设置</button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <nav class="tabbar">
    <button class="nav-item active" data-tab="today"><svg class="icon"><use href="#i-home"/></svg>今日</button>
    <button class="nav-item" data-tab="tasks"><svg class="icon"><use href="#i-list"/></svg>任务</button>
    <button class="nav-item" data-tab="weekly"><svg class="icon"><use href="#i-chart"/></svg>周报</button>
    <button class="nav-item" data-tab="digest"><svg class="icon"><use href="#i-trending"/></svg>日报</button>
    <button class="nav-item" data-tab="companion"><svg class="icon"><use href="#i-chat"/></svg>陪伴</button>
    <button class="nav-item" data-tab="me"><svg class="icon"><use href="#i-user"/></svg>我的</button>
  </nav>
</div>

<button class="fab" id="fabNew"><svg class="icon" style="color:#fff"><use href="#i-plus"/></svg></button>
<div class="sheet-mask hidden" id="sheet"></div>
<div class="toast hidden" id="toast"></div>

<script src="app.js?v=2"></script>
