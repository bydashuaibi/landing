<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>着陆 · 把焦虑变成下一步</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet">
<style>
:root{
  --bg:#f3ece0;
  --ink:#2a2118;
  --text:#2a2118;
  --muted:#6f6253;
  --surface:rgba(255,255,255,.62);
  --surface-2:rgba(255,255,255,.42);
  --line:rgba(46,36,25,.14);
  --khaki:#c2a878;
  --khaki-deep:#a98a5b;
  --tawny:#8b6f47;
  --terracotta:#c0703c;
  --terracotta-d:#a85d2c;
  --violet:#6f4fe6; --violet-2:#8b6dff;
  --green:#2f9e6b; --red:#d24b4b; --amber:#bf8a16; --blue:#3b6fb0;
  --teal:#1f9e8e; --rose:#d6627a;
  --shadow:0 16px 44px rgba(46,36,25,.16); --radius:22px;
  --sun:#e0a93b; --cloud:#7a8a99; --rain:#4f86c6; --storm:#7c6fd6;
  --e-out:cubic-bezier(.16,1,.3,1);
  --e-soft:cubic-bezier(.22,.61,.36,1);
  --e-pen:cubic-bezier(.37,.01,.2,1);
  --font-display:"BubbledotICG-FinePos","Inter Tight",monospace;
  --shadow-soft:0 4px 14px rgba(46,36,25,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  font-feature-settings:"kern" 1;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(58% 48% at 18% 10%, rgba(194,168,120,.34), transparent 62%),
    radial-gradient(52% 44% at 86% 18%, rgba(31,158,142,.16), transparent 62%),
    radial-gradient(70% 60% at 52% 102%, rgba(192,112,60,.14), transparent 60%),
    radial-gradient(40% 30% at 80% 80%, rgba(214,98,122,.10), transparent 60%),
    #f3ece0;
}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg, rgba(46,36,25,.04), transparent 28%),
             linear-gradient(0deg, rgba(46,36,25,.06), transparent 42%);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;flex:none}
.icon.sm{width:15px;height:15px}
.icon.lg{width:26px;height:26px}

/* 布局 */
#app{display:flex;min-height:100vh}
.sidebar{
  width:240px;flex:none;
  background:linear-gradient(180deg, rgba(255,255,255,.66) 0%, rgba(255,255,255,.55) 34%, rgba(255,255,255,.50) 100%);
  backdrop-filter:blur(18px) saturate(118%);-webkit-backdrop-filter:blur(18px) saturate(118%);
  border:1px solid var(--line);border-radius:22px;
  margin:12px;padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:calc(100vh - 24px);
  animation:slideL .9s var(--e-out) .05s both;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--khaki),var(--tawny));
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-soft),0 6px 18px rgba(139,111,71,.30)}
.brand .name{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:-.01em;color:var(--ink)}
.brand .sub{font-size:11px;color:var(--muted)}
.nav-item{
  position:relative;
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;
  color:var(--muted);font-weight:600;font-size:14px;transition:.18s;text-align:left;width:100%;
  animation:riseIn .55s var(--e-out) both;
}
.nav-item:hover{background:rgba(194,168,120,.16);color:var(--ink)}
.nav-item.active{background:linear-gradient(135deg,var(--terracotta),var(--terracotta-d));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(168,93,44,.35),0 6px 16px rgba(192,112,60,.28)}
.nav-item.active::after{content:"";position:absolute;bottom:4px;left:50%;width:3px;height:3px;border-radius:50%;
  background:#fff;box-shadow:-5px 0 0 #fff,5px 0 0 #fff;transform:translateX(-50%);opacity:.85}
.nav-item:nth-child(1){animation-delay:.30s}.nav-item:nth-child(2){animation-delay:.35s}
.nav-item:nth-child(3){animation-delay:.40s}.nav-item:nth-child(4){animation-delay:.45s}
.nav-item:nth-child(5){animation-delay:.50s}.nav-item:nth-child(6){animation-delay:.55s}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 22px;margin:12px 12px 0;
  background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.46));
  backdrop-filter:blur(16px) saturate(118%);-webkit-backdrop-filter:blur(16px) saturate(118%);
  border:1px solid var(--line);border-radius:18px;
  position:sticky;top:0;z-index:20;animation:riseIn .6s var(--e-out) .14s both;
}
.topbar h1{font-family:'Inter Tight','Inter',sans-serif;font-size:18px;font-weight:600;color:var(--ink)}
.topbar .actions{display:flex;gap:8px}
#view{padding:20px 22px;max-width:980px;width:100%;margin:0 auto;animation:fadeUp .7s var(--e-soft) .2s both}

/* 移动端 tabbar */
.tabbar{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.52));
  backdrop-filter:blur(18px) saturate(118%);-webkit-backdrop-filter:blur(18px) saturate(118%);
  border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  z-index:30;overflow-x:auto;animation:riseIn .6s var(--e-out) both;
}
.tabbar .nav-item{flex:none;flex-direction:column;gap:3px;font-size:11px;padding:6px 10px;border-radius:10px;animation:none}
.tabbar .nav-item .icon{width:22px;height:22px}
.fab{
  display:none;position:fixed;right:18px;bottom:74px;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--terracotta),var(--terracotta-d));color:#fff;font-size:22px;
  box-shadow:0 10px 24px rgba(192,112,60,.42);z-index:31;align-items:center;justify-content:center;
}

/* 卡片（浅色液态玻璃） */
.card{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.66) 24%, rgba(255,255,255,.62) 78%, rgba(255,255,255,.58) 100%);
  backdrop-filter:blur(26px) saturate(118%);-webkit-backdrop-filter:blur(26px) saturate(118%);
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);margin-bottom:16px;color:var(--ink);
}
.card::after{content:"";position:absolute;top:0;right:0;width:38%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%);
  transform:skewX(-18deg);animation:sheen 1.15s var(--e-soft) 2.55s 1 both;}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px;color:var(--ink)}
.card .hint{color:var(--muted);font-size:13px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}

/* 按钮 */
.btn{padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:linear-gradient(135deg,var(--terracotta),var(--terracotta-d));color:#fff}
.btn.primary:hover{filter:brightness(1.05);box-shadow:0 0 0 1px rgba(168,93,44,.25),0 0 22px rgba(192,112,60,.28),0 4px 14px rgba(46,36,25,.16)}
.btn.ghost{background:rgba(255,255,255,.5);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(194,168,120,.18)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%;justify-content:center}
.btn.teal{background:linear-gradient(135deg,#1f9e8e,#0e8f9e);color:#fff}

/* 表单 */
.field{margin-bottom:14px}
.field>label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--ink)}
.field input,.field textarea,.field select{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  font-family:inherit;font-size:14px;background:rgba(255,255,255,.66);color:var(--ink);
}
.field input::placeholder,.field textarea::placeholder{color:rgba(46,36,25,.40)}
.field textarea{resize:vertical;min-height:80px}
.field .muted{font-size:12px;margin-top:4px;display:block;color:var(--muted)}

/* 推送区 */
.push{
  background:linear-gradient(135deg,rgba(194,168,120,.26),rgba(31,158,142,.14));
  border:1px solid rgba(168,138,91,.34);border-radius:16px;padding:14px 16px;margin-bottom:16px;
  display:flex;align-items:center;gap:12px;transition:.15s;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.push:hover{background:linear-gradient(135deg,rgba(194,168,120,.34),rgba(31,158,142,.22))}
.push .pulse{width:9px;height:9px;border-radius:50%;background:var(--terracotta);flex:none;margin-top:2px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,112,60,.5)}70%{box-shadow:0 0 0 10px rgba(192,112,60,0)}}
.push-body{flex:1;min-width:0}
.push .ptitle{font-weight:800;font-size:14px;color:var(--ink)}
.push .pbody{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.push-actions{display:flex;align-items:center;gap:8px;flex:none}

/* 任务卡 */
.task{
  display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);
  border-radius:16px;margin-bottom:10px;background:rgba(255,255,255,.55);transition:.12s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.task:hover{border-color:var(--terracotta);background:rgba(255,255,255,.72)}
.task .tinfo{flex:1;min-width:0}
.task .tname{font-weight:800;font-size:15px;color:var(--ink)}
.task .tmeta{color:var(--muted);font-size:12px;margin-top:2px}
.bar{height:8px;border-radius:999px;background:rgba(46,36,25,.10);overflow:hidden;margin-top:7px}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--khaki),var(--tawny));transition:width .35s}
.paused{opacity:.58}
.badge-done{font-size:11px;font-weight:800;color:#1f7a4f;background:rgba(47,158,107,.16);padding:3px 9px;border-radius:999px}
.badge-pause{font-size:11px;font-weight:800;color:#8a6512;background:rgba(191,138,22,.18);padding:3px 9px;border-radius:999px}

/* 分类标签 */
.cat{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(194,168,120,.24);color:#8a6d3b}
.cat.health{background:rgba(47,158,107,.16);color:#1f7a4f}
.cat.edu{background:rgba(59,111,176,.16);color:#2f568f}
.cat.create{background:rgba(139,109,255,.16);color:#6a4fd0}
.cat.life{background:rgba(191,138,22,.18);color:#8a6512}
.cat.nature{background:rgba(31,158,142,.16);color:#157a6e}
.cat.recharge{background:rgba(191,138,22,.20);color:#8a6512}

/* 今天一件 */
.one-thing{border:2px dashed rgba(168,138,91,.65);text-align:center;padding:26px 18px;border-radius:18px}
.one-thing .big{font-family:'Inter Tight','Inter',sans-serif;font-size:20px;font-weight:600;margin:8px 0;color:var(--ink)}
.one-thing .done-state{color:#1f7a4f;font-weight:800}

/* 快捷打卡 */
.quick-checkin{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qci{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.55);cursor:pointer;font-size:13px;font-weight:600;transition:.12s;color:var(--ink)}
.qci:hover{border-color:var(--terracotta);background:rgba(194,168,120,.18)}
.qci.done{border-color:#2f9e6b;background:rgba(47,158,107,.14);color:#1f7a4f}

/* 倾倒台 */
.dump{border-left:4px solid var(--khaki)}
.dump .text{white-space:pre-wrap;word-break:break-word;margin-top:6px;color:var(--ink)}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.tag.do{background:rgba(47,158,107,.16);color:#1f7a4f}
.tag.drop{background:rgba(122,138,153,.22);color:#5d6b78}
.tag.feel{background:rgba(191,138,22,.18);color:#8a6512}

/* 情绪气象 */
.weather-pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.wbtn{flex:1;min-width:78px;padding:16px 8px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.5);text-align:center;font-weight:700;color:var(--ink)}
.wbtn .emo{font-size:26px;display:block;margin-bottom:4px}
.wbtn.on{border-color:transparent;color:#fff}
.wbtn.sun.on{background:var(--sun)} .wbtn.cloud.on{background:var(--cloud)} .wbtn.rain.on{background:var(--rain)} .wbtn.storm.on{background:var(--storm)}

/* AI 陪伴 */
.chat{display:flex;flex-direction:column;gap:12px;max-height:54vh;overflow-y:auto;padding:4px}
.bubble{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble.ai{background:rgba(46,36,25,.06);align-self:flex-start;border-bottom-left-radius:4px;color:var(--ink);border:1px solid var(--line)}
.bubble.me{background:linear-gradient(135deg,var(--terracotta),var(--terracotta-d));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.companion-input{display:flex;gap:8px;margin-top:12px}
.companion-input textarea{flex:1;min-height:46px;background:rgba(255,255,255,.66);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-family:inherit;font-size:14px}

/* 日报 */
/* 日报（丰富版） */
.digest-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.digest-toolbar-left h2{display:inline;font-size:16px;font-weight:800;margin:0;color:var(--ink)}
.digest-toolbar-left .hint{font-size:12px;color:var(--muted);margin-left:8px}
.digest-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.dg-pill{padding:5px 14px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.5);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.dg-pill:hover{border-color:var(--terracotta);color:var(--terracotta-d);background:rgba(194,168,120,.18)}
.dg-pill.on{background:linear-gradient(135deg,var(--terracotta),var(--terracotta-d));color:#fff;border-color:transparent;box-shadow:0 2px 12px rgba(192,112,60,.3)}
.digest-section{margin-bottom:22px}
.digest-section-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dsh-title{font-weight:800;font-size:15px;color:var(--khaki-deep)}
.dsh-trend{font-size:11px;font-weight:700;color:#1f7a4f;background:rgba(47,158,107,.14);padding:2px 10px;border-radius:10px;border:1px solid rgba(47,158,107,.24)}
.dg-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:rgba(255,255,255,.6);transition:border-color .2s,transform .15s}
.dg-card:hover{border-color:rgba(192,112,60,.4);transform:translateY(-1px)}
.dg-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.dg-name{font-weight:700;font-size:14px;color:#2f568f;text-decoration:none}
.dg-name:hover{text-decoration:underline}
.dg-stars{font-size:13px;font-weight:700;color:#8a6512}
.dg-desc{color:var(--muted);font-size:12.5px;line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dg-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dg-growth{font-size:11.5px;font-weight:700;color:#1f7a4f}
.dg-growth.neg{color:#d24b4b}
.dg-growth.flat{color:var(--muted)}
.dg-lang{font-size:11px!important;color:var(--muted)}

/* 兼容旧版 digest-cat 样式（保留不删） */
.digest-cat{margin-bottom:16px}
.digest-cat .ch{font-weight:800;font-size:14px;margin-bottom:8px;color:var(--khaki-deep);display:flex;align-items:center;gap:6px}
.repo{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;background:rgba(255,255,255,.58)}
.repo .rn{font-weight:700;font-size:14px;color:var(--ink)}
.repo .rd{color:var(--muted);font-size:12px;margin-top:3px}
.repo .rm{color:#8a6512;font-size:12px;margin-top:3px;font-weight:700}
.repo a{color:#2f568f;text-decoration:none}

/* 看板/周报 */
.kanban{display:flex;flex-direction:column;gap:6px}
.kb-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.kb-row .kl{width:96px;font-size:13px;font-weight:700;flex:none;color:var(--ink)}
.kb-row .kt{flex:1;height:24px;background:rgba(46,36,25,.08);border-radius:6px;overflow:hidden}
.kb-row .kt>div{height:100%;border-radius:6px;transition:width .4s}
.kb-row .kv{width:64px;text-align:right;font-size:12px;color:var(--muted);flex:none}
.stat-row{display:flex;gap:12px;text-align:center}
.stat-col{flex:1;padding:14px 8px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line)}
.stat-num{font-family:var(--font-display);font-size:30px;font-weight:400;letter-spacing:-.01em;color:var(--ink)}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.day-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.55)}
.day-card .dc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.day-card .dc-mood{font-size:20px}
.day-card .dc-stats{display:flex;gap:16px;font-size:13px;margin-bottom:8px;color:var(--muted)}
.day-card .dc-bar{height:8px;border-radius:999px;background:rgba(46,36,25,.08);overflow:hidden}
.day-card .dc-bar>div{height:100%;border-radius:999px}
.day-card .dc-comment{font-size:13px;color:#1f7a4f;font-weight:600;margin-top:6px}

/* 树洞 */
.post{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.55)}
.post .head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.post .body{white-space:pre-wrap;word-break:break-word;color:var(--ink)}

/* 模态 */
.sheet-mask{position:fixed;inset:0;background:rgba(46,36,25,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;backdrop-filter:blur(4px)}
.sheet-mask.show{display:flex}
.sheet{background:rgba(245,239,230,.96);width:100%;max-width:580px;border-radius:20px 20px 0 0;padding:22px;
  max-height:92vh;overflow-y:auto;animation:up .22s ease;border:1px solid var(--line);
  border-bottom:none;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);color:var(--ink)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:4px;color:var(--ink)}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1;justify-content:center}

/* 分类选择器 */
.cat-grid{display:flex;gap:8px;flex-wrap:wrap}
.cat-chip{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.55);font-weight:600;font-size:13px;cursor:pointer;transition:.12s;color:var(--ink)}
.cat-chip.on{background:linear-gradient(135deg,var(--terracotta),var(--terracotta-d));color:#fff;border-color:transparent}
.sub-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sub-chip{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.55);font-size:12px;cursor:pointer;color:var(--ink)}
.sub-chip.on{background:var(--terracotta);color:#fff;border-color:transparent}

/* toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(46,36,25,.92);color:#fff;
  padding:11px 20px;border-radius:12px;font-size:14px;z-index:80;box-shadow:var(--shadow);animation:fade .2s;border:1px solid rgba(255,255,255,.12)}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.ver a{color:var(--terracotta-d);text-decoration:none}

/* 结构化模块头（对齐 landing-prototype 蓝图） */
.mod-head{margin-bottom:18px}
.mod-head .kicker{font-family:var(--font-display);font-size:13px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--khaki-deep)}
.mod-head h2{font-size:25px;font-weight:800;margin:5px 0 7px;font-family:'Inter Tight','Inter',sans-serif;letter-spacing:-.01em;color:var(--ink)}
.mod-head p{color:var(--muted);max-width:680px;font-size:14px;line-height:1.55}

/* WarpText 玻璃折射标题 */
.warp-head{position:relative;display:flex;align-items:center;overflow:hidden;isolation:isolate;min-height:64px;margin:6px 0 8px}
.warp-head h2{font-size:clamp(26px,3.4vw,38px);font-weight:800;margin:0;font-family:'Inter Tight','Inter',sans-serif;letter-spacing:-.02em;color:var(--ink);line-height:1.05}
.mod-head.hero .warp-head{min-height:96px;margin:8px 0 10px}
.mod-head.hero .warp-head h2{font-size:clamp(32px,5vw,56px)}
.warp-head[data-warp-mounted] h2{visibility:hidden}
.warp-head canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

/* 图片占位符（蓝图要求：需要图的地方先占位并标注） */
.ph{position:relative;border:1.5px dashed rgba(168,138,91,.45);border-radius:14px;
  background:repeating-linear-gradient(45deg, rgba(194,168,120,.06) 0 12px, transparent 12px 24px);
  display:flex;align-items:center;justify-content:center;min-height:120px;
  color:var(--muted);text-align:center;padding:18px;font-size:13px;overflow:hidden}
.ph.big{min-height:240px;margin-bottom:16px}
.ph .tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;letter-spacing:.04em;
  background:rgba(194,168,120,.24);color:#8a6d3b;padding:4px 9px;border-radius:8px;border:1px solid rgba(168,138,91,.4)}
.ph .need{font-weight:600;color:rgba(46,36,25,.72);max-width:82%}
.ph .need b{color:var(--ink)}

/* 关键帧 */
@keyframes reveal{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sheen{from{transform:translate3d(-150%,0,0) skewX(-18deg)}to{transform:translate3d(260%,0,0) skewX(-18deg)}}
.anim{opacity:0;animation:reveal .85s var(--e-out) forwards;animation-delay:var(--d,0s)}
:focus-visible{outline:2px solid var(--khaki-deep);outline-offset:2px}

@media(max-width:820px){
  .sidebar{display:none}
  .tabbar{display:flex}
  .fab{display:flex}
  #view{padding:16px 14px 90px}
  .topbar{padding:14px 16px}
  .kb-row .kl{width:72px}
  .stat-row{gap:8px}
  .stat-num{font-size:22px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .card::after{display:none}
  .anim{opacity:1!important;transform:none!important;filter:none!important}
}
</style>
</head>
