<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>着陆 · 把焦虑变成下一步</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06121b;
  --ink:#ffffff;
  --surface:rgba(255,255,255,.16);
  --surface-2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.14);
  --text:#ffffff;
  --muted:rgba(255,255,255,.66);
  --violet:#8b6dff; --violet-2:#b39bff;
  --green:#34d399; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa;
  --teal:#2dd4bf; --rose:#fb7185;
  --shadow:0 14px 44px rgba(0,0,0,.30); --radius:22px;
  --sun:#fbbf24; --cloud:#94a3b8; --rain:#60a5fa; --storm:#818cf8;
  --e-out:cubic-bezier(.16,1,.3,1);
  --e-soft:cubic-bezier(.22,.61,.36,1);
  --e-pen:cubic-bezier(.37,.01,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  font-feature-settings:"kern" 1;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(58% 48% at 18% 10%, rgba(124,92,255,.22), transparent 62%),
    radial-gradient(52% 44% at 86% 18%, rgba(20,184,166,.16), transparent 62%),
    radial-gradient(70% 60% at 52% 102%, rgba(59,130,246,.15), transparent 60%),
    radial-gradient(40% 30% at 80% 80%, rgba(251,113,133,.10), transparent 60%),
    #06121b;
}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg, rgba(4,16,24,.20), transparent 28%),
             linear-gradient(0deg, rgba(4,16,24,.26), transparent 42%);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;flex:none}
.icon.sm{width:15px;height:15px}
.icon.lg{width:26px;height:26px}

/* 布局 */
#app{display:flex;min-height:100vh}
.sidebar{
  width:240px;flex:none;
  background:linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.125) 13%, rgba(255,255,255,.08) 34%, rgba(255,255,255,.07) 100%);
  backdrop-filter:blur(18px) saturate(115%);-webkit-backdrop-filter:blur(18px) saturate(115%);
  border:1px solid rgba(255,255,255,.14);border-radius:22px;
  margin:12px;padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:calc(100vh - 24px);
  animation:slideL .9s var(--e-out) .05s both;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--violet-2));
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(139,109,255,.45)}
.brand .name{font-family:'Inter Tight','Inter',sans-serif;font-weight:600;font-size:18px;letter-spacing:.5px}
.brand .sub{font-size:11px;color:var(--muted)}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;
  color:var(--muted);font-weight:600;font-size:14px;transition:.18s;text-align:left;width:100%;
  animation:riseIn .55s var(--e-out) both;
}
.nav-item:hover{background:rgba(255,255,255,.10);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(139,109,255,.26),rgba(179,155,255,.16));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(179,155,255,.35)}
.nav-item:nth-child(1){animation-delay:.30s}.nav-item:nth-child(2){animation-delay:.35s}
.nav-item:nth-child(3){animation-delay:.40s}.nav-item:nth-child(4){animation-delay:.45s}
.nav-item:nth-child(5){animation-delay:.50s}.nav-item:nth-child(6){animation-delay:.55s}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 22px;margin:12px 12px 0;
  background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
  backdrop-filter:blur(16px) saturate(115%);-webkit-backdrop-filter:blur(16px) saturate(115%);
  border:1px solid rgba(255,255,255,.12);border-radius:18px;
  position:sticky;top:0;z-index:20;animation:riseIn .6s var(--e-out) .14s both;
}
.topbar h1{font-family:'Inter Tight','Inter',sans-serif;font-size:18px;font-weight:600}
.topbar .actions{display:flex;gap:8px}
#view{padding:20px 22px;max-width:980px;width:100%;margin:0 auto;animation:fadeUp .7s var(--e-soft) .2s both}

/* 移动端 tabbar */
.tabbar{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.08));
  backdrop-filter:blur(18px) saturate(115%);-webkit-backdrop-filter:blur(18px) saturate(115%);
  border-top:1px solid rgba(255,255,255,.14);padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  z-index:30;overflow-x:auto;animation:riseIn .6s var(--e-out) both;
}
.tabbar .nav-item{flex:none;flex-direction:column;gap:3px;font-size:11px;padding:6px 10px;border-radius:10px;animation:none}
.tabbar .nav-item .icon{width:22px;height:22px}
.fab{
  display:none;position:fixed;right:18px;bottom:74px;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;font-size:22px;
  box-shadow:0 10px 24px rgba(139,109,255,.45);z-index:31;align-items:center;justify-content:center;
}

/* 卡片（液态玻璃） */
.card{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.235) 24%, rgba(255,255,255,.225) 78%, rgba(255,255,255,.205) 100%);
  backdrop-filter:blur(26px) saturate(118%);-webkit-backdrop-filter:blur(26px) saturate(118%);
  border:1px solid rgba(255,255,255,.16);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);margin-bottom:16px;color:#fff;
}
.card::after{content:"";position:absolute;top:0;right:0;width:38%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent 0%, rgba(255,255,255,.14) 50%, transparent 100%);
  transform:skewX(-18deg);animation:sheen 1.15s var(--e-soft) 2.55s 1 both;}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px}
.card .hint{color:var(--muted);font-size:13px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}

/* 按钮 */
.btn{padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.16)}
.btn.ghost:hover{background:rgba(255,255,255,.20)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%;justify-content:center}
.btn.teal{background:linear-gradient(135deg,#14b8a6,#06b6d4);color:#fff}

/* 表单 */
.field{margin-bottom:14px}
.field>label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 13px;border:1px solid rgba(255,255,255,.18);border-radius:11px;
  font-family:inherit;font-size:14px;background:rgba(255,255,255,.07);color:#fff;
}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.45)}
.field textarea{resize:vertical;min-height:80px}
.field .muted{font-size:12px;margin-top:4px;display:block}

/* 推送区 */
.push{
  background:linear-gradient(135deg,rgba(139,109,255,.22),rgba(45,212,191,.12));
  border:1px solid rgba(179,155,255,.32);border-radius:16px;padding:14px 16px;margin-bottom:16px;
  display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:.15s;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.push:hover{background:linear-gradient(135deg,rgba(139,109,255,.30),rgba(45,212,191,.18))}
.push .pulse{width:9px;height:9px;border-radius:50%;background:var(--violet-2);flex:none;margin-top:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,155,255,.5)}70%{box-shadow:0 0 0 10px rgba(179,155,255,0)}}
.push .ptitle{font-weight:800;font-size:14px}
.push .pbody{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}

/* 任务卡 */
.task{
  display:flex;align-items:center;gap:14px;padding:14px;border:1px solid rgba(255,255,255,.14);
  border-radius:16px;margin-bottom:10px;background:rgba(255,255,255,.08);transition:.12s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.task:hover{border-color:var(--violet-2);background:rgba(255,255,255,.12)}
.task .tinfo{flex:1;min-width:0}
.task .tname{font-weight:800;font-size:15px}
.task .tmeta{color:var(--muted);font-size:12px;margin-top:2px}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:7px}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--violet-2));transition:width .35s}
.paused{opacity:.58}
.badge-done{font-size:11px;font-weight:800;color:var(--green);background:rgba(52,211,153,.16);padding:3px 9px;border-radius:999px}
.badge-pause{font-size:11px;font-weight:800;color:var(--amber);background:rgba(251,191,36,.16);padding:3px 9px;border-radius:999px}

/* 分类标签 */
.cat{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(139,109,255,.20);color:var(--violet-2)}
.cat.health{background:rgba(52,211,153,.18);color:#6ee7b7}
.cat.edu{background:rgba(96,165,250,.18);color:#93c5fd}
.cat.create{background:rgba(192,132,252,.18);color:#d8b4fe}
.cat.life{background:rgba(251,191,36,.18);color:#fcd34d}
.cat.nature{background:rgba(45,212,191,.18);color:#5eead4}
.cat.recharge{background:rgba(251,191,36,.20);color:#fcd34d}

/* 今天一件 */
.one-thing{border:2px dashed rgba(179,155,255,.6);text-align:center;padding:26px 18px;border-radius:18px}
.one-thing .big{font-family:'Inter Tight','Inter',sans-serif;font-size:20px;font-weight:600;margin:8px 0}
.one-thing .done-state{color:var(--green);font-weight:800}

/* 快捷打卡 */
.quick-checkin{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qci{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid rgba(255,255,255,.16);
  border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer;font-size:13px;font-weight:600;transition:.12s}
.qci:hover{border-color:var(--violet);background:rgba(139,109,255,.12)}
.qci.done{border-color:var(--green);background:rgba(52,211,153,.12);color:#6ee7b7}

/* 倾倒台 */
.dump{border-left:4px solid var(--violet)}
.dump .text{white-space:pre-wrap;word-break:break-word;margin-top:6px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.tag.do{background:rgba(52,211,153,.18);color:#6ee7b7}
.tag.drop{background:rgba(148,163,184,.22);color:#cbd5e1}
.tag.feel{background:rgba(251,191,36,.18);color:#fcd34d}

/* 情绪气象 */
.weather-pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.wbtn{flex:1;min-width:78px;padding:16px 8px;border-radius:14px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);text-align:center;font-weight:700;color:#fff}
.wbtn .emo{font-size:26px;display:block;margin-bottom:4px}
.wbtn.on{border-color:transparent;color:#fff}
.wbtn.sun.on{background:var(--sun)} .wbtn.cloud.on{background:var(--cloud)} .wbtn.rain.on{background:var(--rain)} .wbtn.storm.on{background:var(--storm)}

/* AI 陪伴 */
.chat{display:flex;flex-direction:column;gap:12px;max-height:54vh;overflow-y:auto;padding:4px}
.bubble{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble.ai{background:rgba(255,255,255,.10);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.companion-input{display:flex;gap:8px;margin-top:12px}
.companion-input textarea{flex:1;min-height:46px;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:11px 13px;font-family:inherit;font-size:14px}

/* 日报 */
.digest-cat{margin-bottom:16px}
.digest-cat .ch{font-weight:800;font-size:14px;margin-bottom:8px;color:var(--violet-2);display:flex;align-items:center;gap:6px}
.repo{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 13px;margin-bottom:8px;background:rgba(255,255,255,.07)}
.repo .rn{font-weight:700;font-size:14px}
.repo .rd{color:var(--muted);font-size:12px;margin-top:3px}
.repo .rm{color:var(--amber);font-size:12px;margin-top:3px;font-weight:700}
.repo a{color:var(--blue);text-decoration:none}

/* 看板/周报 */
.kanban{display:flex;flex-direction:column;gap:6px}
.kb-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.kb-row .kl{width:96px;font-size:13px;font-weight:700;flex:none}
.kb-row .kt{flex:1;height:24px;background:rgba(255,255,255,.10);border-radius:6px;overflow:hidden}
.kb-row .kt>div{height:100%;border-radius:6px;transition:width .4s}
.kb-row .kv{width:64px;text-align:right;font-size:12px;color:var(--muted);flex:none}
.stat-row{display:flex;gap:12px;text-align:center}
.stat-col{flex:1;padding:14px 8px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10)}
.stat-num{font-size:28px;font-weight:900}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.day-card{border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.07)}
.day-card .dc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.day-card .dc-mood{font-size:20px}
.day-card .dc-stats{display:flex;gap:16px;font-size:13px;margin-bottom:8px;color:var(--muted)}
.day-card .dc-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.day-card .dc-bar>div{height:100%;border-radius:999px}
.day-card .dc-comment{font-size:13px;color:var(--green);font-weight:600;margin-top:6px}

/* 树洞 */
.post{border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.07)}
.post .head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.post .body{white-space:pre-wrap;word-break:break-word}

/* 模态 */
.sheet-mask{position:fixed;inset:0;background:rgba(4,12,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;backdrop-filter:blur(4px)}
.sheet-mask.show{display:flex}
.sheet{background:rgba(16,22,34,.86);width:100%;max-width:580px;border-radius:20px 20px 0 0;padding:22px;
  max-height:92vh;overflow-y:auto;animation:up .22s ease;border:1px solid rgba(255,255,255,.14);
  border-bottom:none;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:4px;color:#fff}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1;justify-content:center}

/* 分类选择器 */
.cat-grid{display:flex;gap:8px;flex-wrap:wrap}
.cat-chip{padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);font-weight:600;font-size:13px;cursor:pointer;transition:.12s;color:#fff}
.cat-chip.on{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border-color:transparent}
.sub-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sub-chip{padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);font-size:12px;cursor:pointer;color:#fff}
.sub-chip.on{background:var(--violet);color:#fff;border-color:transparent}

/* toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,28,40,.92);color:#fff;
  padding:11px 20px;border-radius:12px;font-size:14px;z-index:80;box-shadow:var(--shadow);animation:fade .2s;border:1px solid rgba(255,255,255,.14)}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.ver a{color:var(--violet-2);text-decoration:none}

/* 关键帧 */
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sheen{from{transform:translate3d(-150%,0,0) skewX(-18deg)}to{transform:translate3d(260%,0,0) skewX(-18deg)}}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

@media(max-width:820px){
  .sidebar{display:none}
  .tabbar{display:flex}
  .fab{display:flex}
  #view{padding:16px 14px 90px}
  .topbar{padding:14px 16px}
  .kb-row .kl{width:72px}
  .stat-row{gap:8px}
  .stat-num{font-size:22px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .card::after{display:none}
}
</style>
</head>
