<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>初华 · 着陆桌宠</title><link rel="stylesheet" href="desktop-pet.css"></head><body>
<section id="controls" aria-label="桌宠学习控制"><header><strong>初华 · 陪你学一点</strong><button id="hide" title="隐藏桌宠，首页齿轮可叫回" aria-label="隐藏桌宠">×</button></header><p id="line" role="status">只做五分钟，我陪你。</p><div class="course"><select id="track" aria-label="选择学习方向"><option value="python">Python</option><option value="pytorch">PyTorch</option></select><span id="clock">准备开始</span></div><div class="actions"><button id="start">开始 5 分钟</button><button id="capture">记断点</button><button id="open">打开着陆</button><button id="settle">结束记录</button></div><form id="command"><input id="text" aria-label="告诉初华要做什么" maxlength="160" placeholder="开始学 Python / 暂停 / 记断点"><button aria-label="执行指令">↵</button></form></section>
<button id="avatar" aria-label="初华：点击展开控制，拖动移动，右键更多操作"><span id="sprite"></span></button><span id="hint">点我开始 · 拖动搬家 · 右键菜单</span>
<script src="petdex-sprite.js"></script><script src="desktop-pet-ui.js"></script></body></html>
