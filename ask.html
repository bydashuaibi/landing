<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>这件事记作什么</title>
<style>
  /* 桌面悬浮询问窗（2026-10-14）。他原来的话：「我指的右下角是系统在后台时、弹到桌面的悬浮窗」。
     这是个透明无边框的独立小窗，靠 CSS 画出玻璃卡片的样子 —— 所以背景必须透明，
     圆角外面透出去的是桌面，不是一块黑板。 */
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;
    -webkit-user-select:none;user-select:none;cursor:default}
  .wrap{box-sizing:border-box;height:100%;padding:15px 16px;border-radius:20px;
    background:linear-gradient(180deg,rgba(31,26,22,.97),rgba(15,12,11,.98));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 24px 56px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.08);
    color:#f6f2ec;display:flex;flex-direction:column;
    animation:in .28s cubic-bezier(.16,1,.3,1) both}
  @keyframes in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
  .hd{font-size:12.5px;color:#a79c8e;line-height:1.35}
  .hd b{color:#f6f2ec;font-weight:700}
  .q{font-size:15.5px;font-weight:700;margin:5px 0 9px}
  input{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:11px;
    font:inherit;font-size:14px;background:rgba(255,255,255,.10);color:#f6f2ec;
    border:1px solid rgba(255,255,255,.13);outline:none;
    -webkit-user-select:text;user-select:text}
  input:focus{border-color:#e08a4e;background:rgba(255,255,255,.13)}
  .hint{font-size:11.5px;color:#a79c8e;line-height:1.4;margin-top:7px;min-height:32px}
  .btns{display:flex;gap:8px;margin-top:auto}
  button{flex:1;padding:9px 12px;border:none;border-radius:999px;font:inherit;
    font-size:13.5px;font-weight:700;cursor:pointer;transition:filter .14s,background .14s;font-family:inherit}
  .go{background:linear-gradient(135deg,#e08a4e,#c0703c);color:#fff}
  .go:hover{filter:brightness(1.08)}
  .no{background:rgba(255,255,255,.08);color:#f6f2ec;border:1px solid rgba(255,255,255,.12)}
  .no:hover{background:rgba(255,255,255,.15)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hd">👀 刚才在用 <b id="app">…</b></div>
    <div class="q">这段时间记作什么？</div>
    <input id="name" maxlength="20" placeholder="例如：写代码" autocomplete="off" spellcheck="false">
    <div class="hint" id="hint"></div>
    <div class="btns">
      <button class="go" id="go">记下来</button>
      <button class="no" id="no">这次不用</button>
    </div>
  </div>
<script src="locales.js"></script><script src="i18n-core.js"></script><script src="i18n.js"></script>
<script src="ask.js"></script>
</body>
</html>
